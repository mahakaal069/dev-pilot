spring.application.name=spring-jpa

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/spring_jpa_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:password}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.ai.openai.api-key=${OPENAI_API_KEY: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}
spring.ai.openai.chat.model=gpt-5.6-luna
spring.ai.openai.embedding.model=text-embedding-3-small

# Github OAuth2 Configuration
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:}
spring.security.oauth2.client.registration.github.scope[0]=read:user,repo
spring.security.oauth2.client.provider.github.user-name-attribute=id

server.servlet.session.cookie.name=DEV_PILOT_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=7d

# PG_VECTOR Config
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=1536
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE

# Frontend App Settings
app.frontend.url=${FRONTEND_URL:http://localhost:3000}
app.cors.allowed-origins=${CROS_ALLOWED_ORIGINS:http://localhost:3000}
app.token-encryptor-password=${TOKEN_ENCRYPTOR_PASSWORD:dev-pilot-local-encryptor-key-change-me}
app.token-encryptor-salt=${TOKEN_ENCRYPTOR_SALT:deadbeeffcafebabe}
app.indexing.max-file-bytes=102400
app.indexing.chunk-size=800
app.indexing.chunk-overlap=100
app.github.api-delay-ms=50


